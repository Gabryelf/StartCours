<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок 3: Модульная сцена</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- UI элементы поверх 3D сцены -->
    <div id="info">
        <h1>🚀 УРОК 3: Объекты и модели</h1>
        <p>Сцена | Камера | Свет | Звёзды | Тестовый объект</p>
    </div>
    <div id="controls">
        🖱️ Мышь: вращение камеры | ПКМ: панорамирование 
    </div>
    <div class="status">
        ✅ Сцена загружена | Тестируем вращение
    </div>

    <!-- Панель управления моделями -->
    <div id="model-panel">
        <button id="prev-model" class="model-btn">◀</button>
        <div id="model-info">
            <span id="model-name">Загрузка...</span>
            <span id="model-status"></span>
        </div>
        <button id="next-model" class="model-btn">▶</button>
    </div>

    <!-- Import Map: говорит браузеру, где искать модули -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- Главный модуль приложения -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
