<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки с localStorage</title>
</head>
<body>
    <div class="container">
        <h1>📝 Мои заметки (localStorage)</h1>
        
        <!-- Форма для создания заметки -->
        <div>
            <input type="text" id="title" placeholder="Заголовок заметки">
            <textarea id="content" placeholder="Текст заметки" rows="4"></textarea>
            <button onclick="saveToLocalStorage()">💾 Сохранить в localStorage</button>
            <button onclick="clearAllNotes()">🗑️ Очистить всё</button>
        </div>
    
        <!-- Место для отображения заметок -->
        <div id="notes">
            <!-- Здесь будут отображаться заметки -->
        </div>
    </div>
    <script src="notes_browser.js"></script>
    
</body>
</html>
