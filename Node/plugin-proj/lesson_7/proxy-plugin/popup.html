<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="app">
        <div class="container">
            <h2>🌐 Working Proxy</h2>
            
            <div class="status" id="status">
                <div class="status-icon">⚪</div>
                <div class="status-text">Отключен</div>
            </div>
            
            <div class="server-section">
                <label>🌍 Выберите прокси-сервер:</label>
                <select id="serverSelect">
                    <option value="">Загрузка списка...</option>
                </select>
                <button id="refreshProxiesBtn" class="refresh-btn">🔄 Обновить список</button>
            </div>
            
            <div class="proxy-info" id="proxyInfo" style="display: none;">
                <div class="info-row">
                    <span class="info-label">🌐 IP через прокси:</span>
                    <span class="info-value" id="proxyIp">—</span>
                </div>
            </div>
            
            <button id="toggleBtn" class="connect-btn">🔌 Подключиться</button>
            
            <div class="footer">
                <div class="loading" id="loading" style="display: none;">⏳ Проверка прокси...</div>
                <div class="error" id="errorMsg" style="display: none;"></div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
