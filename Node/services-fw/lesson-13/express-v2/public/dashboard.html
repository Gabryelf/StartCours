<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
        }
        .user-info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать!</h1>
        <div class="user-info" id="userInfo"></div>
        
        <div class="input-group">
            <label for="message">Ваше сообщение:</label>
            <input type="text" id="message" placeholder="Например: Привет, мир!" autocomplete="off">
        </div>
        
        <button onclick="sendMessage()">Отправить на сервер ✨</button>
        
        <div class="result" id="result">
            <div class="result-item">
                <span class="result-label">Длина текста:</span>
                <span class="result-value" id="length"></span>
            </div>
            <div class="result-item">
                <span class="result-label">Количество слов:</span>
                <span class="result-value" id="wordCount"></span>
            </div>
        </div>
        
        <br>
        <button onclick="logout()">Выйти</button>
    </div>
    
    <script src="/dashboard.js"></script>
</body>
</html>
