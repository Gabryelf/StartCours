<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT IO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    </style>
    <!--<link rel="stylesheet" href="style.css">-->
    <style>
        *{
            margin: 0px;
            padding: 0px;
            overflow: hidden;
        }

        body{
            width: 100vh;
            height: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#000, rgb(27, 27, 27));
        }

        div{
            padding: 10px;
        }

        #form > input {
            padding: 10px;
            margin: 10px;
        }

        #form > button{
            padding: 10px;
            margin: 10px;
        }

        #info{
            background-color: #2f2f2f;
            border-radius: 5px;
        }

        h1{
            color: #acffd5;
        }

        #message-list {
            background: linear-gradient(#0f0f0f, #1e1d1d);
            border-radius: 8px;
        }

        #my_message {
            background-color: bisque;
            border-radius: 5px;
        }

        #our_message {
            background-color: aquamarine;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container" id="main">
        <div id="info"><h1>CHAT IO</h1></div>
    <div class="container" id="form">
        <input type="text" class="form-control" id="text-message" placeholder="Введите свое сообщение">
        <button class="btn btn-primary" id="sendBtn">Отправить</button>
    </div>

    <div class="container" id="messages-container">
        <ul id="messages-list">
            <!--<li elements - message>-->
        </ul>
    </div>
    </div>
    

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('text-message');
        const messages_list = document.querySelector('#messages-list');

        let socket = io('http://localhost:8000');

        socket.on('connect', (event) => {
            console.log(socket.id);
        });

        socket.on('newMessageFromClients', (data) => {
            if(data.socket_id === socket.id){
                messages_list.innerHTML += `<li id="my_message">${data.data}</li>`;
            }
            else{
                messages_list.innerHTML += `<li id="our_message">${data.data}</li>`;
            }
            
        });

        function sendMessage(){
            let data = input.value;
            socket.emit('newMessageFromServer', data);
            input.value = null;
        }

        sendBtn.addEventListener('click', sendMessage);
        document.addEventListener('keydown', (event) => {
            if(event.key === 'Enter') sendMessage();

        });
    </script>
    
</body>
</html>
