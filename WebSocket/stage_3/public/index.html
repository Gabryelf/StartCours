<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-io</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center">
        <form class="row" id="message-form">
            <div class="col-6">
                <input type="text" id="user-message" placeholder="Enter your message">
            </div>
            <div class="col-2">
                <input type="submit" class="btn btn-primary" value="Send!">
            </div>
        </form>

        <ul id="messages">
            <!-- this container for our messages the clients -->
        </ul>

    </div>
    
    <!-- automaticali object on server socket.io-->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // global object window.io
        //console.log(io);

        const socket = io('http://localhost:8000');
        //console.log(socket);
        socket.on('connect', () => {
            console.log(socket.id);

        });

        socket.on('messageFromServer', (data) => {console.log(data);});

        socket.on('newMessageToClients', (newMessage) => {
            document.querySelector('#messages').innerHTML += `<li>${newMessage.text}</li>`
        });

        document.querySelector('#message-form').addEventListener('submit', () => {
            event.preventDefault();
            const newMessage = document.querySelector('#user-message').value;
            socket.emit('newMessageFromServer', {text:newMessage});
        });

    </script>
</body>
</html>
