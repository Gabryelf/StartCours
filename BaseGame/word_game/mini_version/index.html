<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Wonders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* СИСТЕМА ЭКРАНОВ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            flex-direction: column;
            padding: 10px;
        }

        .screen.active {
            display: flex;
        }

        /* ГЛАВНЫЙ ЭКРАН */
        #mainScreen {
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .logo h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #4a90e2;
        }

        .logo p {
            font-size: 14px;
            color: #888;
        }

        /* КНОПКА ИГРЫ */
        .start-btn {
            padding: 15px 30px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4a90e2;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
        }

        /* ИГРОВОЙ ЭКРАН */
        #gameScreen {
            gap: 10px;
        }

        /* ХЕДЕР ИГРЫ */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: #333;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .game-stats {
            display: flex;
            gap: 15px;
        }

        .stat-display {
            background: #333;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* ОБЛАСТЬ СЛОВ */
        .words-area {
            flex: 1;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .words-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .word-cell {
            display: flex;
            gap: 2px;
            padding: 5px;
            background: #333;
            border-radius: 6px;
        }

        .letter-cell {
            width: 25px;
            height: 25px;
            background: #444;
            border: 1px solid #555;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #888;
        }

        .letter-cell.revealed {
            background: #2c5282;
            color: white;
        }

        .word-info {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

        /* ОБЛАСТЬ ВВОДА */
        .input-area {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .current-input {
            display: flex;
            justify-content: center;
            gap: 5px;
            min-height: 40px;
            flex-wrap: wrap;
        }

        .input-letter {
            width: 35px;
            height: 35px;
            background: #2c5282;
            border: 2px solid #4a90e2;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        /* КРУГ БУКВ */
        .circle-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }

        .circle-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #4a90e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .circle-letter {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #444;
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
        }

        /* КНОПКИ УПРАВЛЕНИЯ */
        .input-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-btn {
            background: #c53030;
            color: white;
        }

        .reset-btn {
            background: #d69e2e;
            color: white;
        }

        /* ЭКРАН РЕЗУЛЬТАТОВ */
        #resultScreen {
            justify-content: center;
            align-items: center;
        }

        .result-content {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }

        .result-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #4a90e2;
        }

        .result-stats {
            margin: 20px 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .next-btn {
            background: #4a90e2;
            color: white;
        }

        .menu-btn {
            background: #444;
            color: white;
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 360px) {
            .circle-container {
                width: 220px;
                height: 220px;
            }
            
            .circle-letter {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }

        @media (min-height: 700px) {
            .words-area {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="mainScreen" class="screen active">
        <div class="logo">
            <h1>WORD WONDERS</h1>
            <p>Собирай слова из букв</p>
        </div>
        
        <button id="startGameBtn" class="start-btn">
            Начать игру
        </button>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="mainLevel">1</div>
                <div class="stat-label">Уровень</div>
            </div>
            
            <div class="stat-item">
                <div class="stat-value" id="mainScore">0</div>
                <div class="stat-label">Очки</div>
            </div>
        </div>
    </div>
    
    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button id="backBtn" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="game-stats">
                <div class="stat-display">
                    Уровень: <span id="currentLevel">1</span>
                </div>
                <div class="stat-display">
                    Очки: <span id="score">0</span>
                </div>
            </div>
        </div>
        
        <!-- ОБЛАСТЬ СЛОВ -->
        <div class="words-area">
            <div class="words-grid" id="wordsGrid">
                <!-- Слова будут добавлены через JS -->
            </div>
            <div class="word-info" id="wordInfo">
                Найди все слова из доступных букв
            </div>
        </div>
        
        <!-- ОБЛАСТЬ ВВОДА -->
        <div class="input-area">
            <div id="currentInput" class="current-input">
                <!-- Набранные буквы -->
            </div>
            
            <!-- КРУГ С БУКВАМИ -->
            <div class="circle-container" id="circleInput">
                <!-- Буквы будут добавлены через JS -->
            </div>
            
            <!-- КНОПКИ УПРАВЛЕНИЯ -->
            <div class="input-controls">
                <button id="clearBtn" class="control-btn clear-btn" title="Очистить">
                    <i class="fas fa-backspace"></i>
                </button>
                <button id="resetBtn" class="control-btn reset-btn" title="Сбросить">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="resultScreen" class="screen">
        <div class="result-content">
            <div class="result-title" id="resultTitle">Уровень пройден!</div>
            
            <div class="result-stats">
                <div class="stat-row">
                    <span>Найдено слов:</span>
                    <span id="resultFound">0/0</span>
                </div>
                <div class="stat-row">
                    <span>Очки за уровень:</span>
                    <span id="resultScore">0</span>
                </div>
                <div class="stat-row">
                    <span>Всего очков:</span>
                    <span id="resultTotalScore">0</span>
                </div>
            </div>
            
            <div class="result-buttons">
                <button id="nextLevelBtn" class="action-btn next-btn">
                    Следующий уровень
                </button>
                <button id="backToMenuBtn" class="action-btn menu-btn">
                    В меню
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // ОСНОВНОЙ КЛАСС ИГРЫ
        // ==============================================
        class Game {
            constructor() {
                // СОСТОЯНИЕ ИГРЫ
                this.state = {
                    level: 1,
                    score: 0,
                    currentInput: [],
                    foundWords: [],
                    levelData: null
                };
                
                // СПИСОК СЛОВ ДЛЯ ИГРЫ
                this.wordList = [
                    'КОТ', 'ДОМ', 'МАК', 'РОТ', 'ЛЕС', 'СОН', 'НОС', 'РАК',
                    'МОРЕ', 'РЕКА', 'ПОЛЕ', 'ГОРА', 'РУКА', 'НОГА',
                    'СТОЛ', 'СТУЛ', 'ДВЕРЬ', 'ОКНО', 'КНИГА', 'РУЧКА'
                ];
                
                // ИНИЦИАЛИЗАЦИЯ
                this.init();
            }
            
            // ИНИЦИАЛИЗАЦИЯ ИГРЫ
            init() {
                console.log('🎮 Инициализация игры...');
                
                // ЗАГРУЗКА СОХРАНЕНИЙ
                this.loadGame();
                
                // НАСТРОЙКА ОБРАБОТЧИКОВ СОБЫТИЙ
                this.setupEventListeners();
                
                // ОБНОВЛЕНИЕ ГЛАВНОГО ЭКРАНА
                this.updateMainScreen();
                
                console.log('✅ Игра инициализирована');
            }
            
            // ЗАГРУЗКА СОХРАНЕННОЙ ИГРЫ
            loadGame() {
                const saved = localStorage.getItem('wordWondersSave');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this.state.level = data.level || 1;
                        this.state.score = data.score || 0;
                        console.log('📂 Игра загружена из сохранения');
                    } catch (e) {
                        console.log('⚠️ Ошибка загрузки сохранения');
                    }
                }
            }
            
            // СОХРАНЕНИЕ ИГРЫ
            saveGame() {
                const saveData = {
                    level: this.state.level,
                    score: this.state.score
                };
                localStorage.setItem('wordWondersSave', JSON.stringify(saveData));
            }
            
            // НАСТРОЙКА ОБРАБОТЧИКОВ СОБЫТИЙ
            setupEventListeners() {
                // ГЛАВНЫЙ ЭКРАН
                document.getElementById('startGameBtn').addEventListener('click', () => {
                    this.startGame();
                });
                
                // ИГРОВОЙ ЭКРАН
                document.getElementById('backBtn').addEventListener('click', () => {
                    this.showScreen('mainScreen');
                    this.updateMainScreen();
                });
                
                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.clearInput();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetInput();
                });
                
                // ЭКРАН РЕЗУЛЬТАТОВ
                document.getElementById('nextLevelBtn').addEventListener('click', () => {
                    this.nextLevel();
                });
                
                document.getElementById('backToMenuBtn').addEventListener('click', () => {
                    this.showScreen('mainScreen');
                    this.updateMainScreen();
                });
                
                // ОБРАБОТКА КЛАВИАТУРЫ
                document.addEventListener('keydown', (e) => {
                    if (this.getCurrentScreen() === 'gameScreen') {
                        if (e.key === 'Backspace') {
                            this.removeLastLetter();
                        } else if (e.key === 'Enter') {
                            this.submitWord();
                        } else if (e.key.length === 1 && /[а-яА-Яa-zA-Z]/.test(e.key)) {
                            this.addLetter(e.key.toUpperCase());
                        }
                    }
                });
            }
            
            // ПОЛУЧЕНИЕ ТЕКУЩЕГО ЭКРАНА
            getCurrentScreen() {
                const screens = document.querySelectorAll('.screen');
                for (const screen of screens) {
                    if (screen.classList.contains('active')) {
                        return screen.id;
                    }
                }
                return null;
            }
            
            // ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
            showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('active');
                });
                document.getElementById(screenId).classList.add('active');
            }
            
            // ОБНОВЛЕНИЕ ГЛАВНОГО ЭКРАНА
            updateMainScreen() {
                document.getElementById('mainLevel').textContent = this.state.level;
                document.getElementById('mainScore').textContent = this.state.score;
            }
            
            // ЗАПУСК ИГРЫ
            startGame() {
                console.log('🎯 Запуск игры...');
                
                // СБРОС СОСТОЯНИЯ ДЛЯ НОВОГО УРОВНЯ
                this.state.currentInput = [];
                this.state.foundWords = [];
                
                // ГЕНЕРАЦИЯ УРОВНЯ
                this.generateLevel();
                
                // ОБНОВЛЕНИЕ ИГРОВОГО ЭКРАНА
                this.updateGameScreen();
                
                // ПЕРЕХОД НА ИГРОВОЙ ЭКРАН
                this.showScreen('gameScreen');
            }
            
            // ГЕНЕРАЦИЯ УРОВНЯ
            generateLevel() {
                console.log('🎲 Генерация уровня', this.state.level);
                
                // ОПРЕДЕЛЕНИЕ КОЛИЧЕСТВА СЛОВ
                const wordCount = Math.min(3 + Math.floor(this.state.level / 2), 5);
                
                // ВЫБОР СЛУЧАЙНЫХ СЛОВ
                let selectedWords = [];
                let availableWords = [...this.wordList];
                
                for (let i = 0; i < wordCount; i++) {
                    if (availableWords.length === 0) break;
                    
                    const randomIndex = Math.floor(Math.random() * availableWords.length);
                    const word = availableWords[randomIndex];
                    selectedWords.push(word);
                    availableWords.splice(randomIndex, 1);
                }
                
                // СОБИРАЕМ ВСЕ БУКВЫ ИЗ ВЫБРАННЫХ СЛОВ
                let allLetters = [];
                selectedWords.forEach(word => {
                    allLetters.push(...word.split(''));
                });
                
                // ВЫБИРАЕМ УНИКАЛЬНЫЕ БУКВЫ ДЛЯ КРУГА
                const uniqueLetters = [...new Set(allLetters)];
                let availableLetters = uniqueLetters;
                
                // ЕСЛИ БУКВ МАЛО, ДОБАВЛЯЕМ СЛУЧАЙНЫЕ
                if (availableLetters.length < 6) {
                    const alphabet = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
                    while (availableLetters.length < 8) {
                        const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
                        if (!availableLetters.includes(randomLetter)) {
                            availableLetters.push(randomLetter);
                        }
                    }
                }
                
                // ОГРАНИЧИВАЕМ ДО 10 БУКВ
                availableLetters = availableLetters.slice(0, 10);
                
                // ПЕРЕМЕШИВАЕМ БУКВЫ
                for (let i = availableLetters.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [availableLetters[i], availableLetters[j]] = [availableLetters[j], availableLetters[i]];
                }
                
                // СОЗДАЕМ СТРУКТУРУ ДЛЯ ОТОБРАЖЕНИЯ СЛОВ
                const wordCells = {};
                selectedWords.forEach(word => {
                    wordCells[word] = word.split('').map((letter, index) => ({
                        revealed: false,
                        letter: letter,
                        index: index
                    }));
                });
                
                // СОХРАНЯЕМ ДАННЫЕ УРОВНЯ
                this.state.levelData = {
                    availableLetters: availableLetters,
                    targetWords: selectedWords,
                    wordCells: wordCells,
                    allLetters: allLetters
                };
                
                console.log('✅ Уровень сгенерирован:', selectedWords);
            }
            
            // ОБНОВЛЕНИЕ ИГРОВОГО ЭКРАНА
            updateGameScreen() {
                // ОБНОВЛЕНИЕ СТАТИСТИКИ
                document.getElementById('currentLevel').textContent = this.state.level;
                document.getElementById('score').textContent = this.state.score;
                
                // ОТОБРАЖЕНИЕ СЕТКИ СЛОВ
                this.renderWordsGrid();
                
                // ОТОБРАЖЕНИЕ ТЕКУЩЕГО ВВОДА
                this.renderCurrentInput();
                
                // ОТОБРАЖЕНИЕ КРУГА С БУКВАМИ
                this.renderCircleInput();
                
                // ОБНОВЛЕНИЕ ИНФОРМАЦИИ
                const foundCount = this.state.foundWords.length;
                const totalWords = this.state.levelData.targetWords.length;
                document.getElementById('wordInfo').textContent = 
                    `Найдено слов: ${foundCount}/${totalWords}`;
            }
            
            // ОТОБРАЖЕНИЕ СЕТКИ СЛОВ
            renderWordsGrid() {
                const container = document.getElementById('wordsGrid');
                container.innerHTML = '';
                
                this.state.levelData.targetWords.forEach(word => {
                    const wordRow = document.createElement('div');
                    wordRow.className = 'word-row';
                    
                    const isFound = this.state.foundWords.includes(word);
                    
                    this.state.levelData.wordCells[word].forEach((cell, index) => {
                        const cellElement = document.createElement('div');
                        cellElement.className = 'letter-cell';
                        
                        if (isFound || cell.revealed) {
                            cellElement.textContent = cell.letter;
                            cellElement.classList.add('revealed');
                        }
                        
                        wordRow.appendChild(cellElement);
                    });
                    
                    container.appendChild(wordRow);
                });
            }
            
            // ОТОБРАЖЕНИЕ ТЕКУЩЕГО ВВОДА
            renderCurrentInput() {
                const container = document.getElementById('currentInput');
                container.innerHTML = '';
                
                this.state.currentInput.forEach(letter => {
                    const div = document.createElement('div');
                    div.className = 'input-letter';
                    div.textContent = letter;
                    container.appendChild(div);
                });
            }
            
            // ОТОБРАЖЕНИЕ КРУГА С БУКВАМИ
            renderCircleInput() {
                const container = document.getElementById('circleInput');
                container.innerHTML = '';
                
                // ЦЕНТРАЛЬНАЯ КНОПКА ПОДТВЕРЖДЕНИЯ
                const center = document.createElement('div');
                center.className = 'circle-center';
                center.innerHTML = '<i class="fas fa-check"></i>';
                center.onclick = () => this.submitWord();
                container.appendChild(center);
                
                // БУКВЫ ПО КРУГУ
                const letters = this.state.levelData.availableLetters;
                const radius = 85;
                const centerX = 125;
                const centerY = 125;
                
                letters.forEach((letter, index) => {
                    const angle = (index / letters.length) * 2 * Math.PI;
                    const x = centerX + radius * Math.cos(angle);
                    const y = centerY + radius * Math.sin(angle);
                    
                    const btn = document.createElement('div');
                    btn.className = 'circle-letter';
                    btn.textContent = letter;
                    btn.style.left = `${x - 20}px`;
                    btn.style.top = `${y - 20}px`;
                    btn.onclick = () => this.addLetter(letter);
                    
                    container.appendChild(btn);
                });
            }
            
            // ДОБАВЛЕНИЕ БУКВЫ
            addLetter(letter) {
                // ПРОВЕРКА ДОСТУПНОСТИ БУКВЫ
                const usedCount = this.state.currentInput.filter(l => l === letter).length;
                const availableCount = this.state.levelData.allLetters.filter(l => l === letter).length;
                
                if (usedCount < availableCount) {
                    this.state.currentInput.push(letter);
                    this.updateGameScreen();
                }
            }
            
            // УДАЛЕНИЕ ПОСЛЕДНЕЙ БУКВЫ
            removeLastLetter() {
                if (this.state.currentInput.length > 0) {
                    this.state.currentInput.pop();
                    this.updateGameScreen();
                }
            }
            
            // ОЧИСТКА ВВОДА
            clearInput() {
                this.state.currentInput = [];
                this.updateGameScreen();
            }
            
            // СБРОС НАБРАННЫХ БУКВ
            resetInput() {
                this.clearInput();
            }
            
            // ПРОВЕРКА СЛОВА
            submitWord() {
                const word = this.state.currentInput.join('').toUpperCase();
                
                if (word.length < 2) {
                    return;
                }
                
                // ПРОВЕРКА ИСПОЛЬЗОВАНИЯ БУКВ
                const letterCounts = {};
                this.state.currentInput.forEach(letter => {
                    letterCounts[letter] = (letterCounts[letter] || 0) + 1;
                });
                
                const availableCounts = {};
                this.state.levelData.allLetters.forEach(letter => {
                    availableCounts[letter] = (availableCounts[letter] || 0) + 1;
                });
                
                let isValid = true;
                for (const letter in letterCounts) {
                    if (!availableCounts[letter] || availableCounts[letter] < letterCounts[letter]) {
                        isValid = false;
                        break;
                    }
                }
                
                if (!isValid) {
                    this.clearInput();
                    return;
                }
                
                // ПРОВЕРКА СЛОВА
                if (this.state.levelData.targetWords.includes(word)) {
                    if (!this.state.foundWords.includes(word)) {
                        // ДОБАВЛЯЕМ СЛОВО В НАЙДЕННЫЕ
                        this.state.foundWords.push(word);
                        
                        // НАЧИСЛЯЕМ ОЧКИ
                        const points = word.length * 10;
                        this.state.score += points;
                        
                        // ПРОВЕРЯЕМ ЗАВЕРШЕНИЕ УРОВНЯ
                        this.checkLevelCompletion();
                        
                    } else {
                        // СЛОВО УЖЕ НАЙДЕНО
                    }
                } else {
                    // СЛОВА НЕТ В УРОВНЕ
                }
                
                // ОЧИЩАЕМ ВВОД И СОХРАНЯЕМ
                this.clearInput();
                this.saveGame();
            }
            
            // ПРОВЕРКА ЗАВЕРШЕНИЯ УРОВНЯ
            checkLevelCompletion() {
                const allFound = this.state.levelData.targetWords.every(word => 
                    this.state.foundWords.includes(word)
                );
                
                if (allFound) {
                    setTimeout(() => {
                        this.showLevelComplete();
                    }, 500);
                }
            }
            
            // ПОКАЗАТЬ ЭКРАН ПОБЕДЫ
            showLevelComplete() {
                // РАСЧЕТ ОЧКОВ ЗА УРОВЕНЬ
                let levelScore = 0;
                this.state.foundWords.forEach(word => {
                    levelScore += word.length * 10;
                });
                
                // ЗАПОЛНЕНИЕ СТАТИСТИКИ
                document.getElementById('resultFound').textContent = 
                    `${this.state.foundWords.length}/${this.state.levelData.targetWords.length}`;
                document.getElementById('resultScore').textContent = levelScore;
                document.getElementById('resultTotalScore').textContent = this.state.score;
                
                // НАСТРОЙКА ЗАГОЛОВКА
                document.getElementById('resultTitle').textContent = 'Уровень пройден!';
                
                // ПОКАЗ ЭКРАНА
                this.showScreen('resultScreen');
            }
            
            // ПЕРЕХОД НА СЛЕДУЮЩИЙ УРОВЕНЬ
            nextLevel() {
                // ПОВЫШАЕМ УРОВЕНЬ
                this.state.level++;
                
                // СОХРАНЯЕМ ИГРУ
                this.saveGame();
                
                // ЗАПУСКАЕМ НОВЫЙ УРОВЕНЬ
                this.startGame();
            }
        }
        
        // ==============================================
        // ЗАПУСК ИГРЫ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
        // ==============================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Загрузка игры...');
            window.game = new Game();
            console.log('✅ Игра готова!');
        });
    </script>
