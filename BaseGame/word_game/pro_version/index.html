<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Wonders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Главный экран -->
    <div id="mainScreen" class="screen active">
        <div class="logo">
            <h1>WORD WONDERS</h1>
            <p>Собирай слова из букв</p>
        </div>
        
        <div class="mode-buttons">
            <button id="infiniteMode" class="mode-btn infinite">
                <div class="mode-content">
                    <div class="mode-icon">
                        <i class="fas fa-infinity"></i>
                    </div>
                    <div class="mode-text">
                        <h3>Бесконечная игра</h3>
                        <p>Уровни со сложностью</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right"></i>
            </button>
            
            <button id="dailyMode" class="mode-btn daily">
                <div class="mode-content">
                    <div class="mode-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="mode-text">
                        <h3>Слово дня</h3>
                        <p>Новая тема каждый день</p>
                    </div>
                </div>
                <div id="dailyStatus" class="mode-status status-available">Доступно</div>
            </button>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.2);">
                    <i class="fas fa-trophy" style="color: #60a5fa;"></i>
                </div>
                <div class="stat-value" id="mainLevel">1</div>
                <div class="stat-label">Уровень</div>
            </div>
            
            <div class="stat-item">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.2);">
                    <i class="fas fa-lightbulb" style="color: #f59e0b;"></i>
                </div>
                <div class="stat-value" id="mainHints">3</div>
                <div class="stat-label">Подсказки</div>
            </div>
            
            <div class="stat-item">
                <div class="stat-icon" style="background: rgba(34, 197, 94, 0.2);">
                    <i class="fas fa-eye" style="color: #4ade80;"></i>
                </div>
                <div class="stat-value" id="mainAttempts">5</div>
                <div class="stat-label">Попытки</div>
            </div>
        </div>
    </div>
    
    <!-- Игровой экран -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button id="backBtn" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="header-center">
                <div class="header-stat level-display">
                    <i class="fas fa-trophy"></i>
                    <span id="currentLevel">1</span>
                </div>
                
                <div class="header-stat score-display">
                    <i class="fas fa-star"></i>
                    <span id="score">0</span>
                </div>
                
                <div class="header-stat attempts-display">
                    <i class="fas fa-fire"></i>
                    <span id="remainingAttempts">0</span>/<span id="totalLetters">0</span>
                </div>
            </div>
            
            <div class="header-right">
                <button id="hintBtnHeader" class="hint-btn-header" title="Открыть слово">
                    <i class="fas fa-lightbulb"></i>
                </button>
                <button id="revealBtnHeader" class="reveal-btn-header" title="Открыть букву">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        
        <!-- Представление слов -->
        <div class="words-area">
            <div class="words-grid" id="wordsGrid">
                <!-- Ячейки букв будут добавлены через JS -->
            </div>
            <div class="word-info" id="wordInfo">
                Найди все слова из доступных букв
            </div>
        </div>
        
        <!-- Область ввода -->
        <div class="input-area">
            <div id="currentInput" class="current-input">
                <!-- Введенные буквы -->
            </div>
            
            <div class="circle-container" id="circleInput">
                <!-- Круг с буквами и кнопкой подтверждения в центре -->
            </div>
            
            <div class="input-controls">
                <button id="clearBtn" class="control-btn clear-btn" title="Очистить">
                    <i class="fas fa-backspace"></i>
                </button>
                <button id="resetBtn" class="control-btn reset-btn" title="Сбросить набранные буквы">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="shuffleBtn" class="control-btn shuffle-btn" title="Перемешать буквы">
                    <i class="fas fa-random"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Экран результатов -->
    <div id="resultScreen" class="screen">
        <div class="result-content">
            <div class="result-icon" id="resultIcon">🏆</div>
            <div class="result-title" id="resultTitle">Уровень пройден!</div>
            <div class="result-message" id="resultMessage">Отлично! Вы нашли все слова этого уровня.</div>
            
            <div class="result-stats">
                <div class="stat-row">
                    <span class="stat-label">Найдено слов:</span>
                    <span class="stat-value" id="resultFound">0/0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Заработано очков:</span>
                    <span class="stat-value" id="resultScore">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Осталось попыток:</span>
                    <span class="stat-value" id="resultAttempts">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Новый уровень:</span>
                    <span class="stat-value" id="resultNextLevel">2</span>
                </div>
            </div>
            
            <div class="result-buttons">
                <button id="nextLevelBtn" class="action-btn next-btn">
                    <i class="fas fa-arrow-right"></i>
                    Следующий уровень
                </button>
                <button id="backToMenuBtn" class="action-btn menu-btn">
                    <i class="fas fa-home"></i>
                    В меню
                </button>
            </div>
        </div>
    </div>
    
    <!-- Сообщения -->
    <div id="messageOverlay" class="message-overlay">
        <div class="message-box">
            <div id="messageIcon" class="message-icon">✨</div>
            <div id="messageText" class="message-text">Сообщение</div>
            <button id="messageOk" class="message-btn">OK</button>
        </div>
    </div>
    
    <!-- Подключение JavaScript файлов -->
    <script src="data/word-list.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage-manager.js"></script>
    <script src="js/level-generator.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/ui-manager.js"></script>
    <script src="js/screen-manager.js"></script>
    <script src="js/event-handlers.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
