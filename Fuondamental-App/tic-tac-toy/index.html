<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toy</title>

    <link rel="stylesheet" href="style.css">

    <link rel="apple-touch-icon" sizes="57x57" href="./favicons/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="./favicons/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="./favicons/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="./favicons/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="./favicons/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./favicons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="./favicons/apple-icon-144x144.png">

    <link rel="icon" type="image/png" sizes="192x192"  href="./favicons/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="./favicons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">

    <meta name="msapplication-TileImage" content="./favicons/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
</head>
<body>

    <div id="board">
        <div class="rows" id="row-1">
            <button class="interactable" id="but-1"><img src="" class="img-inter" id="img-1"></button>
            <button class="interactable" id="but-2"><img src="" class="img-inter" id="img-2"></button>
            <button class="interactable" id="but-3"><img src="" class="img-inter" id="img-3"></button>
        </div>
        <div class="rows" id="row-2">
            <button class="interactable" id="but-4"><img src="" class="img-inter" id="img-4"></button>
            <button class="interactable" id="but-5"><img src="" class="img-inter" id="img-5"></button>
            <button class="interactable" id="but-6"><img src="" class="img-inter" id="img-6"></button>
        </div>
        <div class="rows" id="row-3">
            <button class="interactable" id="but-7"><img src="" class="img-inter" id="img-7"></button>
            <button class="interactable" id="but-8"><img src="" class="img-inter" id="img-8"></button>
            <button class="interactable" id="but-9"><img src="" class="img-inter" id="img-9"></button>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
